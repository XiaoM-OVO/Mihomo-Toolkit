# =====================================================================
# 📦 Mihomo-Toolkit  统一配置模板
# =====================================================================
# 一句话数据流：
#   subscriptions → 清洗/重命名 → groups（组怎么长）+ pools（可选节点集合）→ routing（谁走谁）→ 产物
#
# 必改两项：
#   subscriptions   订阅清单
#   output          产物输出路径
#
# 三条规则记住就不绕：
#   • routing 是唯一规则来源：表里出现即生效，没写就没有，数组顺序即优先级
#   • groups 只声明「组」，不产出规则；多数场景写 { ref: <键> } 引用内置目录
#   • 所有被注释的项都有内置默认值，取消注释即可覆盖
#
# 交付形态（outputMode 字段或 CLI -m / --mode）：
#   config  完整配置（默认）｜ nodes  纯节点数组 ｜ report  审计报告 JSON
# =====================================================================


# ───── ① 订阅源与拉取 ─────────────────────────────────────────────────
# 抓取出口（本地代理 + 容灾兜底）
fetchProxyPort: 7890          # 抓取代理端口，留空=直连；每项订阅可用 proxy 单独覆盖
fetchProxyStrategy: "auto"    # direct=直连 / proxy=代理 / auto=先直连失败自动走代理
# 直连模式：本机 DNS 解析失败/无记录一律拒绝（fail-closed）
# 代理模式：目标域名由代理侧解析，本机校验无法约束实际出口；需要完整 SSRF 防护时，
#           请在代理侧配置 ACL 拒绝私网/回环/云元数据目标
# fetchRetry: 2               # 拉取失败重试次数（超时/网络错误/5xx 重试，4xx 快速失败）
# fetchTimeout: 15            # 单次拉取超时秒数
# fetchStaleTtl: 24           # 网络中断时复用上次成功缓存的小时数（0=关闭容灾）
# expireAggregation: "min"    # 多订阅到期聚合：min=最早到期预警(推荐) / max=最晚 / first=首项

# 订阅正文格式自动识别，无需额外配置：
#   • 多协议 URI 列表（vless:// vmess:// trojan:// ss:// hysteria2:// tuic:// socks:// http://）
#   • Base64 编码的 URI 列表 / YAML
#   • 标准 YAML 订阅（顶层 proxies: 数组）
#   • 结构化单节点声明（直接在 subscriptions 里书写 type/server/port 等对象）
subscriptions:
  - url: "https://example.com/api/v1/sub1"
    tag: "订阅A"
    # enabled: true             # 是否启用该订阅（false 可临时停用）
    # indexPrefix: "A"          # 节点序号前缀（如 A01/B01），不填按地区统一编号
    # proxy: false              # 单独指定是否走本地代理
    # retry: 3                  # 单独指定重试次数
    # resetDay: 19              # 每月固定重置日（自动计算「距离重置剩余 X 天」）
  - url: "https://example.com/api/v1/sub2"
    tag: "订阅B"

  # 本地文件：- url: "./my-local-nodes.yaml"

  # 内联 URI（随大流：自动清洗、地区识别、模板重命名、进各地区组）
  # - uri: "hysteria2://password@hk01.example.com:443/?sni=hk01.example.com#Hy2-HK"
  #   tag: "自建"

  # 内联 URI（开小灶：指定名称 + 定向投放，不随大流进其他组）
  # - uri: "vless://uuid@us01.example.com:443?security=tls#My-VPS"
  #   name: "🇺🇸 专线·我的自建节点"
  #   keepName: true            # 保留原名：不执行模板重命名，豁免无效/广告节点拦截
  #   groups:                   # 定向投放（可写现有组名，也可写自定义新组名）
  #     - "🤖 ChatGPT"
  #     - "📍 手动选择"

  # 结构化单节点（支持链式代理 dialerProxy）
  # - type: socks5              # socks5 / http / ss / vless / vmess / trojan 等
  #   server: "198.51.100.1"
  #   port: 1080
  #   username: "user"
  #   password: "pass"
  #   name: "🇺🇸 自建专线"       # 有 name 时默认保持该名
  #   tag: "自建"
  #   keepName: true
  #   dialerProxy: "🇭🇰 香港前置"  # 前置节点被重命名时会自动级联更新


# ───── ② 输出与运行 ───────────────────────────────────────────────────
outputMode: "config"            # config (完整配置) | nodes (纯节点) | report (审计报告)
output: "./dist/config.yaml"    # 产物输出路径
# logLevel: "info"              # silent | error | warn | info | debug
# redactLevel: "partial"        # 日志脱敏：off 完整 URL / partial 保留协议与域名 / full 隐藏 IP 与域名
# enablePipeline: true          # 流水线总控：false 则跳过策略编排与内核优化，仅交付清洗后的节点
# enableIPv6: false             # 全局 IPv6：控制 TUN / DNS / 路由；本机无公网 IPv6 时保持 false


# ───── ③ 配置组织：片段挂载 include ───────────────────────────────────
# 片段与主文件共用同一套 schema，无需学习新概念。适合按「变动频率」拆分。
# 优先级：主文件 > include[n] > ... > include[0]
# 合并：数组并集去重（保留先出现顺序）、对象深度递归、标量后者覆盖
# 支持片段内再 include（相对路径以该片段所在目录为基准），环路/超深直接报错
# 跨片段关闭某个组/条目时，必须显式写 disabled: true（并集语义下注释不生效）
# include:
#   - "./base.yaml"
#   - "./overrides.yaml"


# ───── ④ 节点清洗与重命名 ─────────────────────────────────────────────
enableDedupe: true                 # 底层物理特征指纹去重
enableDashboard: true              # 生成订阅状态看板节点（流量剩余、套餐到期等）
removeInfoNodes: true              # 过滤机场原生说明/流量提示伪节点
# strictRegionMatch: false         # true=严格字典匹配 / false=允许国旗 Emoji 与启发式识别
# adTextThreshold: 6               # 纯文本广告判定阈值（无数字/线路特征且长度超过此值）
# whitelistKeywords:               # 白名单：包含即放行并保留原名
#   - "x-ray"
#   - "自建"
# blockKeywords:                   # 黑名单关键词（优先于白名单）
#   - "免费领取"
# blockServers: []                 # 黑名单服务器地址（优先于白名单）

enableNodeRename: true             # 节点重命名总开关（false=保留原名，地区识别照常进行）
showFeatureIcon: true              # 节点名后追加特征 Emoji（🚀 4K 等）
# enableNodeSort: false            # 智能排序：大区 → 隔离分桶 → 线路质量 → 倍率升序
# renameTemplate: "{icon} {region} {index} {features} | {in} {city} {line} {multi} {ip_stack} · {transport}"
# 改名模板变量：
#   {airport}   订阅标签前缀        {icon}      国旗/地区 Emoji
#   {region}    地区中文名          {index}     自动补零序号
#   {features}  特征图标            {protocol}  协议 Emoji
#   {in}        入口城市            {city}      落地城市
#   {line}      线路特征            {multi}     倍率（x0.5 / x2.0）
#   {ip_stack}  IP 栈标识           {transport} 传输协议（WS / GRPC）
# renameSeparators: ["|", "-", "·", "/"]   # 允许自动清理的悬空分隔符
# indexPrefixMap: { "订阅A": "A" }         # 序号前缀映射（= 订阅的 indexPrefix）
# specialNodeRules:                        # 自定义重命名规则
#   - { reg: "/iepl|iplc/i", targetName: "专线" }
# nodeIpVersion: "dual"             # 节点连接 IP 栈：dual 双栈竞速(推荐) / ipv6-prefer / ipv4-prefer / ipv6 / ipv4


# ───── ⑤ 节点裂变 ─────────────────────────────────────────────────────
# enableFission: false             # 单域名并发解析为多个 IP 独立节点
# fissionMaxNodes: 5               # 单域名最大裂变节点数
# fissionStack: "all"              # all=双栈 / v4=纯 IPv4 / v6=纯 IPv6
# fissionExcludeKeywords:          # 含这些关键词的节点跳过裂变
#   - "负载均衡"
#   - "故障转移"


# ───── ⑥ 策略组 groups ────────────────────────────────────────────────
# groups 只声明「组长什么样、成员是谁」，不产出任何规则。
#   • { ref: <键> } 引用内置目录：列了即激活，可覆写任意字段，未知键直接报错并列出可用键
#   • 目录之外的组直接写完整声明，字段与目录条目完全同构
#   • disabled: true 显式关闭（跨 include 片段时必需）
#   • direction: split | return 限定生效方向
#   • 组要接流量，必须在 ⑦ routing 里写指向它的条目
# 内置目录已覆盖 AI / 流媒体 / 社交 / 游戏 / 开发学术 / 系统服务 / 专项服务。
#
# match / exclude 配方（pools 共用同一套语法）：
#   region: ["hk", "jp"]            地区代码 / "asia" / "!cn" / "unknown"
#   multi: "<= 1.5"                 倍率区间 [0, 1.5] / "> 2.0" / "== 1.0"
#   tags: ["streaming", "!lowMulti"] 标签（可数组 OR / 取反 / { any, all }）
#   pattern: "/(?:iepl|iplc)/i"     名称子串或正则
#   protocol: ["hysteria2", "tuic"] 协议类型（可取反 "!http"）
#   airport: ["主力机场A"]          订阅来源标签
#   mode: all | any                 复合条件默认 all（exclude 默认 any）
#
# proxies 成员可写固定名，也可写宏：
#   @matchedNodes  @residentialGroup  @defaultProxy  @standardOptions
#   @activeRegions  @asia  @europe  @americas  @oceania  @sea  @preferredRegions  @nonCnRegions
#   （完整宏表见 CONFIGURATION.md 2.1）
# groups:
#   - { ref: chatgpt }               # 引用内置 ChatGPT 组
#   - { ref: gemini }
#   - { ref: claude, disabled: true } # 显式关闭
#   - ref: copilot                   # 引用条目亦可覆写字段
#     name: 我的 Copilot 线路
#     type: url-test
#   - name: 我的专属线路             # 目录之外的自定义组
#     match: { region: ["hk", "jp"], multi: "<= 1.0" }
#     proxies: ["@matchedNodes", "DIRECT"]

# 拓扑与呈现（进阶，全部有默认值）
# minorNodeThreshold: 3            # 小众地区独立建组最小节点数（低于则折叠进大洲组）
# coreRegions: ["cn", "hk", "tw", "jp", "kr", "sg", "us"]  # 主力免折叠大区
# enableRegionHashLB: false        # 地区组增加哈希负载均衡（建议配 regionGroupType: select）
# hideUnknownGroup: false          # 面板隐藏「🗑️ 未知识别」组
# groupIconMode: "emoji"           # emoji | icon（纯净名+在线图标）| both | none
# groupIcons:                      # 图标覆盖
#   自动选择: "⚡"
#   手动选择: { emoji: "📍", icon: "Static.png" }
# exemptGroups:                    # 追加「永不被空组剪枝」的组名（只增不减）
#   - "🏠 家宽优选"
# iconRepoOrz / iconRepoKoolson / iconRepoLige47   # 在线图标仓库前缀


# ───── ⑦ 分流表 routing（最常改的一项）─────────────────────────────────
# routing 是唯一规则来源：数组顺序即优先级，前面写的先匹配。
# 条目三选一：
#   { preset: ai }                      整段预设展开
#   { service: twitter }                单个服务
#   { rule: "DOMAIN-SUFFIX,a.com" }     原生规则（两段式由 to 补目标，三段式自带目标）
# 可选字段：
#   to: <组名 | DIRECT | REJECT | @pool:池名>   覆写目标
#   disabled: true                              停用同键条目
#   direction: split | return                   仅指定方向生效
# 预设清单：subscription / quic / ads / ai / streaming / social / game / dev /
#           specialized / system / process / bt / download / domestic / final
# 下表与出厂默认一致。想少一类就删条目；只想留某几个服务就换成逐条 service。
routing:
  - preset: subscription
  - service: ad-block
  - preset: ai
  - preset: streaming
  - preset: game
  - preset: dev
  - service: telegram
  - preset: system
  - preset: process
  - preset: bt
  - preset: download
  - preset: domestic
  - preset: final

# 常用改法：
#   开社交整段：    - preset: social
#   只开某一个：    - service: twitter
#   激进广告拦截：  - service: anti-ad
#   拦截 QUIC：     - preset: quic
#   私域直连（最高优先级，放最前）：
#     - rule: "IP-CIDR,192.168.0.0/16,DIRECT,no-resolve"
#     - rule: "DOMAIN-SUFFIX,company.internal"
#       to: "DIRECT"
#   换目标：
#     - service: youtube
#       to: 我的专属线路
#
# 自定义 Rule-Provider（供上面的 rule / RULE-SET 引用）
# customRuleProviders:
#   my-rules:
#     type: http
#     behavior: domain
#     url: "https://example.com/my-rules.yaml"
#     path: ./ruleset/my-rules.yaml
#     interval: 86400
#     format: yaml
#
# 订阅域名/IP 直连（自动注入最前列直连规则与 fake-ip-filter，防止刷新订阅走代理循环）
# subDomain: "sub.example.com"


# ───── ⑧ 节点池与隔离 ────────────────────────────────────────────────
# 池 = 用 match 圈出的一组节点，本身不是策略组；被 routing.to 或 @pool:<池名> 引用时才物化。
# 内置池：家宽优选 / 高倍率优选 / 实验节点（需 enableIsolation: true）、低倍率节点（恒在，默认隐藏）
# enableIsolation: true            # 打开后三个隔离池启用，成员从地区池剔除（默认 false）
# lowMultiThreshold: 0.99          # 倍率 <= 此值标记低倍率（0 关闭）
# highMultiThreshold: 2.5          # 倍率 > 此值标记高倍率
# pools:                           # 自定义池（与内置池共用命名空间，重名报错）
#   - name: 低延迟节点
#     match: { region: [hk, jp], multi: "<= 1" }
#     isolate: false               # true=成员从地区池剔除
#     hidden: false                # true=物化后的组在面板隐藏
#     group: onDemand              # always=总是建组 / onDemand=被引用才建（默认）
#     type: select                 # select（默认） / fallback

# 家宽节点注入业务组（需 enableIsolation: true，键=地区或 "all"）
# residentialNodeGroups:
#   "all": ["ChatGPT", "Gemini"]
#   "hk": ["ChatGPT"]


# ───── ⑨ 服务编目扩展 ─────────────────────────────────────────────────
# 新增或覆写服务：新增项会自动并入对应分类的预设，也可用 { service: <键> } 单独点名。
# servicesConfigFile: "./services.config.js"   # 外部 .js / .yaml / .json（相对本文件目录，缺失即报错）
# customServices:
#   ai:
#     chatgpt:                     # 只覆盖部分字段（未写的正则/图标/规则集全量继承）
#       name: "专属ChatGPT"
#       emoji: "🧠"
#     deepseek:                    # 纯新增第三方服务
#       name: "DeepSeek"
#       emoji: "🧠"
#       reg: "/\\b(?:DeepSeek|DS|深度求索)\\b/i"
#       rules: "deepseek"          # 自动映射 geosite/deepseek
#       icon: { repo: "koolson", file: "AI.png" }
#   streaming:
#     hbo:
#       name: "HBO Max"
#       emoji: "🎬"
#       reg: "HBO|HBOMax"
#       rules: "hbomax"
#       icon: "https://example.com/hbo.png"
# aiPreferredRegions: ["us", "jp", "tw", "sg", "kr", "eu"]   # AI 组无专属节点时的地区兜底顺序


# ───── ⑩ 进程分流名单 ─────────────────────────────────────────────────
# 由 routing 的 { preset: process } / { preset: bt } 启用；表里没有这两个 preset 就不生成进程规则。
# osType: "windows"                # windows | mac | linux | all（决定读取哪一组名单）
# processDirectWin:                # Windows 强制直连（覆写默认）
#   - qBittorrent
#   - Thunder
#   - BitComet
#   - uTorrent
#   - aria2c
# processDirectMac:                # macOS 强制直连（默认 Thunder/BitComet/uTorrent/qbittorrent/aria2c/transmission-daemon）
#   - Thunder
#   - qbittorrent
# processDirectLin:                # Linux 强制直连（默认 qbittorrent/aria2c/transmission-daemon）
#   - qbittorrent
#   - aria2c
# processProxyWin:                 # 走下载策略的工具（默认 IDMan/fdm）
#   - IDMan
#   - fdm
# processProxyMac:                 # 走下载策略的工具（默认 fdm）
#   - fdm
# processProxyLin: []              # 默认空；写 [] 即清空该平台名单


# ───── ⑪ 测速与规则集 ────────────────────────────────────────────────
testTolerance: 50                  # url-test 切换延迟容忍度（ms，防频繁颠簸）
# testInterval: 300                # 健康检查间隔（秒）
# testURL: "https://cp.cloudflare.com/generate_204"
# useMRS: true                     # 使用 Mihomo 二进制规则集（省内存）
# ruleProviderCDN: "https://fastly.jsdelivr.net/gh"
# geositeRepo: "MetaCubeX/meta-rules-dat@meta/geo/geosite"
# geoipRepo: "MetaCubeX/meta-rules-dat@meta/geo/geoip"


# ───── ⑫ DNS 与 Hosts ─────────────────────────────────────────────────
# 解析链分工：
#   dnsDefault  引导 DNS（必须纯 IP，破除解析死锁）
#   dnsDirect   国内/直连域名解析
#   dnsProxy    海外代理域名解析
#   dnsServer   节点服务器域名专用解析（不吃分流）
# overwriteDns: true               # 注入防泄漏 DNS 总开关
# dnsListen: "127.0.0.1:1053"
# dnsAllowNonLoopback: false       # 安全铁律 INV-8：非回环监听=对外开放解析器，软路由才开
# allowPrivateDns: false           # 是否允许私网地址作为解析器
# trustedPrivateCidrs: []          # 显式信任的私网解析器网段，如 ["192.168.1.0/24"]
# dnsDefault: ["223.5.5.5", "119.29.29.29"]
# dnsDirect: ["https://223.5.5.5/dns-query", "https://120.53.53.53/dns-query"]
# dnsProxy: ["https://8.8.8.8/dns-query", "https://1.1.1.1/dns-query"]
# dnsServer: ["223.5.5.5", "119.29.29.29"]
# fakeIpFilterNodes: "smart"       # 节点域名注入 fake-ip-filter：smart 主域聚合 / exact 逐项 / off 关闭
# fakeIpFilter:                    # 追加自定义 fake-ip-filter 条目
#   - "+.my-internal.company"
# assetClosure: "standard"         # 订阅 DNS 依赖继承：standard 按节点域名 / strict 仅白名单 / off 不继承
# assetDomainAllowlist: []         # assetClosure=strict 时允许继承的域名
# protectedDomains:                # 在只读基线之外追加受保护域名（只增不减，无法清空基线）
#   - "mybank.example"
# hosts: {}                        # 静态 hosts（受保护域名与内网地址默认被拒绝）
# nameserverPolicy: {}             # 按域分流解析链（保留键不可覆盖）
# trustedHostDomains: []           # hosts 覆盖受保护域名的例外清单（谨慎使用）
# allowInternalHosts: false        # 允许 hosts 指向内网（等同开放内网探测）


# ───── ⑬ 内核覆写与网络安全 ───────────────────────────────────────────
# enableTrafficAudit: true         # 非标端口流量强制直连
# overwriteTun: true               # 注入 TUN 配置
# overwriteSniffer: true           # 注入域名嗅探器（精确嗅探 TLS/HTTP）
# enableCoreOptimize: true         # 内核性能调优与指纹伪装
# QUIC 拦截由 routing 的 { preset: quic } 启用（默认表不含）


# ───── ⑭ 简繁中文转换（可选，需 npm install opencc-js）─────────────────
# enableChineseConvert: false
# chineseConvertMode: "s2t"         # s2t=简体转繁体 / t2s=繁体转简体


# ───── ⑮ 服务端部署与安全（常驻 server 模式生效，CLI 不受限）────────────
# ⚠️ 监听地址不在本文件配置：由环境变量 HOST 或 startServer({ host }) 控制
#    （历史字段 serverHost 从未被读取，已废弃）
# 安全姿态（默认值即安全）：
#   • 默认只监听 127.0.0.1；监听非回环地址时必须配 authToken，否则 ?url= / ?config= 被拒绝
#   • ?config= 远程配置视为不可信输入：只允许 http(s) 订阅源，DNS 控制面/本机资源字段被剥夺
#   • 产物顶层键受交付契约白名单约束：external-controller / secret / script / tunnels / hosts 不进入产物
# enableCache: true                # 内存构建缓存
# cacheTtl: 300                    # 新鲜缓存秒数
# cacheStaleMaxAge: 86400          # SWR 陈旧缓存最大容忍秒数（超期同步重构）
# refreshCooldown: 15              # ?refresh=1 强制刷新冷却（秒，0 关闭）
# autoRefreshInterval: 3600        # 后台自动拉取与预热周期（秒，0 关闭）
# enableWarmup: true               # 启动时后台预热初始订阅
# authToken: "your-secret-token"   # 访问鉴权（?token=xxx 或 Authorization 头）
# enableUrlParams: true            # 允许 ?url= / ?config= 动态传参
# maxConcurrentBuilds: 8           # 并发构建上限，超出返回 503
# security:                        # 资源配额（本机可信字段，远程配置无法写入）
#   maxSubscriptionUrls: 20
#   maxRemoteConfigBytes: 1048576  # 1MB
#   maxSubscriptionBytes: 8388608  # 8MB，流式截断
#   maxTotalNodes: 5000
#   perSubscriptionMaxNodes: 3000
