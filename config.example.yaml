# =====================================================================
# 📦 Mihomo-Toolkit (MTK) 统一配置文件模板
# =====================================================================
# 📖 三分钟概念速览
# ─────────────────────────────────────────────────────────────────────
# 统一流水线支持三种输出形态（outputMode 字段或 CLI -t 参数）：
#   config  【默认/推荐】完整配置文件：订阅拉取 ➔ 节点清洗 ➔ 状态看板 ➔ 策略组与分流 ➔ 内核优化
#           • 全自动执行「智能节点资产依赖保活沙箱」，既保活节点专属 DNS/Hosts，又杜绝控制面夺权污染
#   nodes   【纯净节点】仅执行节点清洗、去重与打标，输出干净的 proxies 节点数组（专供客户端）
#   report  【审计报告】输出结构化节点清洗统计与健康审计报告 (JSON)
#
# 💡 不修改节点名称：只需将 enableNodeRename 设为 false 即可，
#    底层的地区识别、倍率抽取与特征分析仍会照常进行，确保策略组依然精准归类。
#
# 📌 被注释的配置项均带内置默认值，按需取消注释覆盖即可。
# =====================================================================


# ─────────────────────────────────────────────────────────────────────
# ① 订阅源与拉取设置
# ─────────────────────────────────────────────────────────────────────
# 抓取设置（本地代理 + 容灾兜底）
fetchProxyPort: 7890          # 抓取代理端口，留空=直连；每项订阅可用 proxy 单独覆盖
fetchProxyStrategy: "auto"    # direct=直连 / proxy=代理 / auto=先直连失败自动走代理
# fetchRetry: 2               # 拉取失败重试次数（超时/网络错误/5xx 重试，4xx 快速失败）
# fetchTimeout: 15            # 单次拉取超时秒数
# fetchStaleTtl: 24           # 网络中断时复用上次成功缓存的小时数（0=关闭容灾）
# expireAggregation: "min"    # 多订阅到期聚合策略：min=最早到期预警(推荐) / max=最晚 / first=首项

# 订阅清单（支持多订阅并行抓取；url 为远程链接或本地 YAML 路径）
subscriptions:
  - url: "https://example.com/api/v1/sub1"
    tag: "机场A"
    # master: true              # 显式标记主订阅（用于主权参考与优先基准）
    # enabled: true             # 是否启用该订阅（设为 false 可临时停用）
    # indexPrefix: "A"          # 节点序号前缀（如 A01/B01），不填按地区统一编号
    # proxy: false              # 单独指定是否走本地代理
    # retry: 3                  # 单独指定重试次数
    # resetDay: 19              # 每月固定重置日（自动计算"距离重置剩余 X 天"）
  - url: "https://example.com/api/v1/sub2"
    tag: "机场B"

  # 本地文件示例
  # - url: "./my-local-nodes.yaml"

  # 直接注入单节点 URI (支持 hysteria2:// tuic:// vless:// vmess:// trojan:// ss:// socks:// http://)
  # - uri: "hysteria2://password@node.example.com:443/?sni=node.example.com#Hy2-HK"
  #   tag: "自建"
  #   name: "我的自建Hy2节点"


# ─────────────────────────────────────────────────────────────────────
# ② 运行模式与输出
# ─────────────────────────────────────────────────────────────────────
outputMode: "config"            # config (完整配置) | nodes (纯节点) | report (审计报告)
output: "./dist/config.yaml"    # 默认输出路径
# logLevel: "info"              # silent | error | warn | info | debug
# redactLevel: "partial"        # 日志脱敏档位：
#   off     本地调试：完整展示 URL
#   partial 推荐日常：仅保留协议与域名，屏蔽参数与凭据
#   full    分享脱敏：隐藏全部 IP 与域名


# ─────────────────────────────────────────────────────────────────────
# ③ 部署与安全（常驻 server 模式生效，CLI 本地运行不受限）
# ─────────────────────────────────────────────────────────────────────
# enableCache: true                # 是否启用本地内存缓存
# cacheTtl: 300                    # 缓存有效时间（秒）
# authToken: "your-secret-token"   # 服务端访问鉴权 Token (?token=xxx 或 Authorization 头)
# enableUrlParams: true            # 是否允许前端通过 ?url= / ?config= 动态传参
# security:
#   maxSubscriptionUrls: 20        # 单次允许的最大订阅 URL 数
#   maxRemoteConfigBytes: 1048576  # 远程配置最大字节数 (1MB)
#   maxTotalNodes: 5000            # 单次允许最大处理节点总数
#   perSubscriptionMaxNodes: 3000  # 单个订阅最大允许节点数


# ─────────────────────────────────────────────────────────────────────
# ④ 简繁中文转换（可选，需 npm install opencc-js）
# ─────────────────────────────────────────────────────────────────────
# enableChineseConvert: false      # 开启简繁智能转换
# chineseConvertMode: "s2t"        # s2t=转为繁体中文 / t2s=转为简体中文


# ─────────────────────────────────────────────────────────────────────
# ⑤ 节点清洗与去重（cleaner）
# ─────────────────────────────────────────────────────────────────────
enableDedupe: true                 # 开启底层物理特征指纹去重
enableDashboard: true              # 生成高颜值订阅状态虚拟看板节点（流量剩余、套餐到期等）
removeInfoNodes: true              # 自动过滤机场原生说明伪节点（避免与合成看板冲突）
enableAirportTag: true             # 多订阅时自动为节点打上机场来源标签
# strictRegionMatch: false         # 严格地区匹配模式
# adTextThreshold: 6               # 纯文本广告判定阈值（无数字/线路特征且长度超过此值判定为广告）
# whitelistKeywords:               # 白名单豁免关键词（包含即放行并保留原名）
#   - "x-ray"
#   - "自建"
# blockKeywords: []                # 节点名黑名单关键词（包含即直接剔除）
# blockServers: []                 # 节点服务器地址黑名单（包含即直接剔除）


# ─────────────────────────────────────────────────────────────────────
# ⑥ 域名多 IP 节点裂变（fission）
# ─────────────────────────────────────────────────────────────────────
# enableFission: false             # 开启单域名并发解析为多个 IP 独立实体节点
# fissionMaxNodes: 4               # 单域名最大裂变节点数
# fissionStack: "all"              # all=双栈 / v4=纯 IPv4 / v6=纯 IPv6
# fissionExcludeKeywords:          # 包含这些关键词的节点跳过裂变
#   - "负载均衡"
#   - "故障转移"


# ─────────────────────────────────────────────────────────────────────
# ⑦ 节点重命名与模板
# ─────────────────────────────────────────────────────────────────────
enableNodeRename: true             # 是否启用节点重命名（设为 false 可原样保留节点名称，且不影响地区识别）
showFeatureIcon: true              # 是否在节点名后追加特征 Emoji 图标 (如 🚀 4K 等)
# renameTemplate: "{icon} {region} {index} {features} | {in} {city} {line} {multi} {ip_stack} · {transport}"
# 命名模板可用变量:
#   {airport}   机场标签前缀 (如 [AirportA])
#   {icon}      国家/地区国旗 Emoji (如 🇭🇰, 🇯🇵)
#   {region}    国家/地区中文名称 (如 香港, 日本)
#   {index}     按大区与订阅前缀自动补零序号 (如 01, L01)
#   {features}  特征图标/说明 (如 🤖, 🏠, 📺)
#   {protocol}  协议 Emoji (如 🛸, 🦊, 🐴)
#   {in}        入口城市 (如 深, 沪, 京)
#   {city}      落地城市 (如 洛杉矶, 东京)
#   {line}      线路特征 (如 BGP, IPLC, CN2)
#   {multi}     节点倍率数值 (如 x0.5, x2.0)
#   {ip_stack}  IP栈标识 (如 IPv6, 双栈)
#   {transport} 传输协议 (如 WS, GRPC)


# ─────────────────────────────────────────────────────────────────────
# ⑧ 策略组总控与拓扑模式（profile）
# ─────────────────────────────────────────────────────────────────────
# 核心策略总控
proxyFirst: true                   # true=海外代理优先 / false=国内直连优先
defaultProxyMode: "manual"         # auto (自动测速) | manual (手动选择) | fallback (故障转移) | direct | reject
regionGroupType: "url-test"        # 地区策略组类型: url-test (测速优选) | select (手动选择) | fallback (故障转移)
# minorNodeThreshold: 3            # 小众地区独立建组最小节点数（低于此值自动折叠至大洲组）
# hideGarbageGroup: false          # 是否在面板中隐藏「🗑️ 未知识别」组

# 基础应用策略组开关
enableAI: true                     # 启用独立 AI 策略组 (ChatGPT, Claude, Gemini, Copilot 等)
enableStreaming: true              # 启用独立流媒体策略组 (YouTube, Netflix, Disney+, Spotify 等)
enableSocial: true                 # 启用社交应用策略组 (Telegram, Twitter 等)
enableGame: true                   # 启用游戏平台策略组 (Steam, Epic, PlayStation 等)
enableGitHub: true                 # 启用 GitHub 极速策略组
enableScholar: false               # 启用学术资源策略组 (Google Scholar, Sci-Hub 等)
enableDomesticGroup: false         # 启用中国大陆分流策略组 (🇨🇳 中国分流)
enableAdBlock: true                # 启用内置轻量广告拦截策略组 (🚫 广告拦截)
enableAntiAD: false                # 启用激进广告拦截规则集 (anti-ad)
enableTelegram: true               # Telegram 独立分流策略组
# enableCrypto: false              # 启用加密货币交易所分流策略组
# enablePayPal: false              # 启用 PayPal 独立分流策略组
# enableWebRTC: false              # 启用 WebRTC 专项分流策略组

# 高级节点隔离
# lowMultiThreshold: 0.99          # 倍率 <= 此值的节点自动标记为下载节点 (0 关闭)
# isolateDownload: false           # true=将下载节点从普通大区池中剔除，聚合入「⏬ 下载策略」组
# isolateHighMulti: false          # true=将高倍率节点从普通大区池中剔除，聚合入「🚀 高倍率优选」组
# highMultiThreshold: 2.5          # 高倍率判定阈值
# isolateExperimental: false       # true=将含测试/实验/备用字样的节点剔除聚合入「🧪 实验节点」组


# ─────────────────────────────────────────────────────────────────────
# ⑨ 动态服务注册表（增删 key 即开关对应策略组）
# ─────────────────────────────────────────────────────────────────────
# 🤖 AI 助手服务列表 (需开启 enableAI: true)
aiServices:
  - chatgpt
  - gemini
  - claude
  - copilot
aiPreferredRegions:                # AI 策略组地区保底优先列表 (默认无专属节点时兜底)
  - us
  - jp
  - tw
  - sg
  - kr
  - eu

# 📺 流媒体服务列表 (需开启 enableStreaming: true)
streamingServices:
  - youtube
  - netflix
  - disney
  - bilibili
  - tiktok
  - spotify
  - bahamut
  - pixiv
  - twitch
# biliPreferredRegions:            # Bili 港澳台专属优选用组 (默认: 台湾、澳门、香港)
#   - "🇹🇼 台湾节点"
#   - "🇲🇴 澳门节点"
#   - "🇭🇰 香港节点"

# 💬 海外社交平台服务列表 (需开启 enableSocial: true)
socialServices:
  - twitter
  - facebook
  - instagram
  - discord
independentSocial:                 # 独立成组的社交应用 (其余自动合并到「💬 社交平台」)
  - twitter

# 🎮 游戏平台服务列表 (需开启 enableGame: true)
gameServices:
  - steam
  - epic
  - riot
  - blizzard
  - nintendo
  - playstation
  - xbox
  - ubisoft
  - origin
  - ea

# 🪟 操作系统基础云服务列表
enableSystemServices: true
systemServices:
  - microsoft
  - apple
  - google

# 🧩 动态服务编目扩展（支持行内定义或外部挂载配置文件）
# servicesConfigFile: "./services.config.js" # 外部服务定义配置文件路径 (支持 .js / .yaml / .json)
# customServices:
#   ai:
#     # 场景 A: 仅覆盖官方内置服务的某些字段（未写的字段如正则、图标、规则集全量继承）
#     chatgpt:
#       name: "专属ChatGPT"
#       emoji: "🧠"
#     # 场景 B: 纯新增全新第三方服务
#     deepseek:
#       name: "DeepSeek"
#       emoji: "🧠"
#       reg: "/\\b(?:DeepSeek|DS|深度求索)\\b/i" # 支持标准正则字符串或简单关键词
#       rules: "deepseek"                      # 自动映射 geosite/deepseek
#       icon: { repo: "koolson", file: "AI.png" }
#   streaming:
#     hbo:
#       name: "HBO Max"
#       emoji: "🎬"
#       reg: "HBO|HBOMax"
#       rules: "hbomax"
#       icon: "https://example.com/hbo.png"     # 也支持直接填完整 URL 图标


# ─────────────────────────────────────────────────────────────────────
# ⑩ 节点自定义分组与家宽注入
# ─────────────────────────────────────────────────────────────────────
# 🎯 自定义节点分组：将包含特定关键词的节点追加到指定策略组
#    键 = 关键词 (不区分大小写匹配节点名)，值 = 目标策略组数组
# customNodeGroups:
#   "xray": ["🤖 ChatGPT", "♊ Gemini", "🔍 Google"]
#   "自建": ["📍 手动选择", "🐱 GitHub"]

# 🏠 家宽节点注入 (需开启 enableResidential: true)
# enableResidential: false         # 家宽节点独立成组「🏠 家宽优选」，不混入普通池
# residentialNodeGroups:           # 将家宽节点注入到应用策略组：键=地区("all"或"hk"/"us")，值=策略组列表
#   "all": ["🤖 ChatGPT", "♊ Gemini"]
#   "hk": ["🤖 ChatGPT"]


# ─────────────────────────────────────────────────────────────────────
# ⑪ 进程级分流名单与自定义分流规则
# ─────────────────────────────────────────────────────────────────────
# 🛑 BT / P2P 下载软件直连防封号
enableProcessDirect: true          # P2P/BT 强制直连
# processDirectWin:                # Windows 强制直连进程名单 (覆写默认)
#   - qBittorrent
#   - Thunder
#   - BitComet
#   - uTorrent
#   - aria2c
# processProxyWin:                 # Windows 强制走下载策略的工具
#   - IDMan
#   - fdm

# 🎯 自定义路由规则与 Rule-Providers (注入到 MATCH 之前，优先级最高)
# customRules:
#   - "DOMAIN-SUFFIX,company.internal,DIRECT"
#   - "IP-CIDR,192.168.0.0/16,DIRECT,no-resolve"
#   - "RULE-SET,my-custom-rules,📍 手动选择"
# customRuleProviders:
#   my-custom-rules:
#     type: http
#     behavior: domain
#     url: "https://example.com/my-rules.yaml"
#     path: ./ruleset/my-rules.yaml
#     interval: 86400
#     format: yaml


# ─────────────────────────────────────────────────────────────────────
# ⑫ 测速与规则集
# ─────────────────────────────────────────────────────────────────────
testTolerance: 50                  # 自动选择组切换延迟容忍度 (ms，防止频繁颠簸)
# testInterval: 300                # 自动健康检查测速间隔 (秒)
# testURL: "https://cp.cloudflare.com/generate_204"
# useMRS: true                     # 启用 Mihomo Rule-Set 极速二进制规则集格式 (节省内存)
# ruleProviderCDN: "https://fastly.jsdelivr.net/gh" # 规则集加速 CDN 前缀


# ─────────────────────────────────────────────────────────────────────
# ⑬ DNS 高级覆写与防泄漏模式
# ─────────────────────────────────────────────────────────────────────
# overwriteDns: true               # 注入权威防泄漏 DNS
# dnsMergeMode: "secure"           # secure=权威覆写(脚本配置绝对优先) / merge=补缺合并(保留并安全挂载节点专属解析)
# fakeIpFilterNodes: "smart"       # 节点防环注入模式:
                                   #   smart  【推荐】智能主域聚合泛化（折叠为 +.<主域>），排除 SNI 伪装干扰，配置清爽紧凑
                                   #   exact  逐项保留节点完整服务器域名（旧版兼容行为，仍剔除 SNI 伪装）
                                   #   off    完全不向 fake-ip-filter 注入任何节点域名（由内核原生出站机制直连）
# fakeIpFilter:                    # 自定义 fake-ip-filter 规则名单追加
#   - "+.my-internal.company"
# dnsListen: "127.0.0.1:1053"      # 本地 DNS 监听端口 (建议绑定回环，防止成为公网开放解析器)
# dnsDefault:                      # 基础引导 DNS (必须为纯 IP，破除解析死锁)
#   - "223.5.5.5"
#   - "119.29.29.29"
#   - "1.1.1.1"
# dnsDirect:                       # 直连域名 DoH
#   - "https://223.5.5.5/dns-query"
#   - "https://120.53.53.53/dns-query"
# dnsProxy:                        # 海外代理域名 DoH
#   - "https://8.8.8.8/dns-query"
#   - "https://1.1.1.1/dns-query"
# dnsServer:                       # 节点服务器域名专用解析 DNS
#   - "223.5.5.5"
#   - "119.29.29.29"


# ─────────────────────────────────────────────────────────────────────
# ⑭ 内核优化与网络安全
# ─────────────────────────────────────────────────────────────────────
# enableTrafficAudit: true         # 审计非标端口流量，非 53/80/443 强制直连
enableQUICReject: true             # 屏蔽海外 UDP 443 (QUIC)，强制降级 TCP 保证画质与速度
# overwriteTun: true               # 注入高性能 TUN 虚拟网卡配置
# overwriteSniffer: true           # 注入域名嗅探器配置 (强制精确嗅探 TLS/HTTP)
# enableCoreOptimize: true         # 启用内核层全面性能调优与指纹伪装
