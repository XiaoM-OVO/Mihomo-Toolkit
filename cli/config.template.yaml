# ==============================================================
# 📦 Mihomo-Toolkit CLI 官方配置模板 (支持多订阅合并)
# ==============================================================

# 【1】多订阅节点源配置 (可选)
# 如果你配置了这里，运行 node index.js 时就不需要加 -u 参数了。
# 所有的订阅会被自动抓取、合并，然后统一丢给清洗脚本处理。
subscriptions:
  - url: "https://example.com/sub1.yaml"
    tag: "AirportA"  # (可选) 会自动注入到每个节点名前面，并触发打标机制

  - url: "https://example.com/sub2.yaml"
    tag: "AirportB"

  # 你也可以直接混入本地文件
  # - url: "./my-local-nodes.yaml"


# 【2】全局共享配置 (会同时在 pure-nodes 和 mihomo-toolkit 中生效)
# 例如，你在下面更改了模板，两个脚本都会严格遵循这个新模板。
# --------------------------------------------------------------
# 开启节点重命名
enableNodeRename: true
# 节点重命名模板 (注意这里可以加上 {airport} 变量来承接上面的 tag)
renameTemplate: "[{airport}] {icon} {region} {index} | {line} {multi}"
# 是否去重 (跨机场合并时强烈建议开启，能够干掉底层完全相同的节点)
enableDedupe: true
# 是否移除流量/到期等信息节点
removeInfoNodes: true
# 延迟测速容忍度，防止频繁切换
testTolerance: 50


# 【3】清洗脚本专属配置 (pure-nodes.js)
# 这里的配置只有在进行节点提纯时才会生效。
# --------------------------------------------------------------
pureConfig:
  # 多订阅建议开启，这会让上方定义的 tag 自动被脚本通过正则提取并处理
  enableAirportTag: true
  
  # 是否调用外部 IP 库解析真实的节点 ASN 与组织信息 (需网络连通)
  # 开启后可将 {isp}、{org}、{asn} 等变量注入到 renameTemplate 中
  enableIpEnrich: false
  
  # 广告拦截阈值：文字长度超过此值的会被当做广告节点干掉
  # 纯净版默认 12（比主脚本 6 更宽松，降低误杀率）
  adTextThreshold: 12

  # === 节点裂变 (高级功能，将域名节点裂变为多个 IP 实体节点) ===
  # enableFission: true                # 开启裂变
  # fissionStack: "all"                # "all" / "v4" / "v6"
  # fissionMaxNodes: 3                 # 单个域名最多裂变数量 (建议 2~5)
  # fissionExcludeKeywords:            # 跳过裂变的关键词黑名单
  #   - "负载均衡"
  #   - "故障转移"
  #   - "最优选择"

  # 输出模式：配合 CLI 的 --meta 参数使用，可导出分桶统计和清洗报告
  # outputMode: "array"                # "array" 纯节点数组 / "object" 含 meta


# 【4】主脚本专属配置 (mihomo-toolkit.js)
# 这里的配置只有在生成策略组、分流、路由系统时才会生效。
# --------------------------------------------------------------
toolkitConfig:
  # 各种流媒体、AI的分流开关
  enableAdBlock: true
  enableAI: true
  enableStreaming: true
  enableGame: true
  
  # 是否开启国内应用分流策略组
  enableDomesticGroup: false

  # 极速规则模式 (使用 MRS 格式，大幅降低内存占用)
  useMRS: true

  # [防二次污染机制]
  # 默认情况下，在 full 模式（全自动流水线）中，CLI 会智能地给主脚本强制注入 `enableNodeRename: false`。
  # 因为清洗脚本已经洗干净名字了，主脚本不需要再洗一次。
  # 除非你硬性在这里写 `enableNodeRename: true`，才会覆盖那个智能保护。
